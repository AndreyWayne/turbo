version: '3.8'
services:
  db:
    image: postgres:13-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/some_name/
      POSTGRES_PASSWORD: ipadib339
      TZ: Europe/Moscow
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /usr/src/server
    ports:
      - '9000:9000'
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
    depends_on:
      - db

  client:
    image: node:18-bullseye-slim # Готовый образ с git
    command: sh -c "npm install && npm run build &&  npm run start"
    volumes:
      - ./frontend:/usr/src/client
    working_dir: /usr/src/client
    ports:
      - '3000:3000'
    environment:
      HOST: 0.0.0.0

  admin:
    image: node:18-bullseye-slim # Готовый образ с git
    command: sh -c "npm install && npm run build &&  npm run start"
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - '8080:3000'
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
    depends_on:
      - server

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Ipadib339
    ports:
      - '5050:80'
    depends_on:
      - db

volumes:
  data: {}
