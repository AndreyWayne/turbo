version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ipadib339
      TZ: Europe/Moscow
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  server:
    image: node:18-alpine
    command: sh -c "npm install && npm run start"
    volumes:
      - ./backend:/usr/src/server
    working_dir: /usr/src/server
    ports:
      - '9000:9000'
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
    depends_on:
      - db

  client:
    image: node:18-alpine
    command: sh -c "npm install && npm run start"
    volumes:
      - ./frontend:/usr/src/client
    working_dir: /usr/src/client
    ports:
      - '3000:3000'
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
    depends_on:
      - server

  admin:
    image: node:18-alpine
    command: sh -c "npm install && npm run start"
    volumes:
      - ./admin:/usr/src/admin
    working_dir: /usr/src/admin
    ports:
      - '8080:3000'
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
    depends_on:
      - server

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Ipadib339
    ports:
      - '5050:80'
    depends_on:
      - db

volumes:
  data: {}
